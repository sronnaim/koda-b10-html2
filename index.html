<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Chessboard using HTML Table">
        <title>HTML Chessboard</title>
    </head>

    <body>
        <main>
            <article>
                <h1>HTML Chessboard</h1>
                <table border="2" cellpadding="20" cellspacing="2">
                    <thead>
                        <tr>
                            <th scope="col" bgcolor="white"></th>
                            <th scope="col" bgcolor="black"></th>
                            <th scope="col" bgcolor="white"></th>
                            <th scope="col" bgcolor="black"></th>
                            <th scope="col" bgcolor="white"></th>
                            <th scope="col" bgcolor="black"></th>
                            <th scope="col" bgcolor="white"></th>
                            <th scope="col" bgcolor="black"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                        </tr>
                        <tr>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                        </tr>
                        <tr>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                        </tr>
                        <tr>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                        </tr>
                        <tr>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                        </tr>
                        <tr>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                            <td bgcolor="black"></td>
                            <td bgcolor="white"></td>
                        </tr>
                    </tfoot>
                </table>
            </article>            
        </main>    
    </body>
</html>
